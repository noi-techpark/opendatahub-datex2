replicaCount: 1

image:
  repository: ghcr.io/noi-techpark/opendatahub-datex2/opendatahub-datex2
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  annotations: {}
  className: nginx
  hosts:
    - host: datex.api.opendatahub.com
      paths:
        - path: /
          pathType: Prefix

# The event-category -> DATEX II classname/typeValue mapping is not
# configured here: it's the shared Open Data Hub taxonomy, not something
# that varies per deployment or provider, so it's baked into the image as
# subtypes.yaml (see src/subtypes.yaml) instead of being duplicated across
# every values file.
config:
  listenAddr: ":8080"
  baseUrl: "https://datex.api.opendatahub.com"

  # One binary instance serves every provider listed here, each polled on
  # its own interval. Add another entry to support another region/place.
  providers:
    - name: "province-bz"
      eventsUrl: "https://tourism.api.opendatahub.com/v1/Announcement?pagesize=200000&tagfilter=announcement%3Atraffic-event&removenullvalues=true&getasidarray=false&source=PROVINCE_BZ&fields=Id%2CTagIds%2CGeo%2CMapping%2C_Meta%2CStartTime%2CEndTime%2CFirstImport%2CLastChange%2CDetail"
      source: "PROVINCE_BZ"
      pollIntervalSeconds: 20
      idPrefix: "urn:announcements:provincebz:"
      internalSupplier: "ITPBZ"
      recipients:
        - type: "situation-publication"
          supplier: "IT492"
          description: "A22 - Brenner motorway"
          path: "/datex/2/province-bz/situation-publication.xml"
          enabled: true

resources: {}

podAnnotations: {}
podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
