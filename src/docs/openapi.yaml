openapi: 3.0.3
info:
  title: Datex II Traffic Events
  version: "1.0"
  description: |
    This API republishes Open Data Hub traffic event announcements as DATEX II
    SituationPublication XML feeds, one per event provider.

    This API is considered an [R&D prototype](https://opendatahub.com/lifecycle-management/),
    and thus we cannot guarantee future availability nor stability. If you intend to use
    this API for production deployments, please contact the Open Data Hub team
    help@opendatahub.com
externalDocs:
  description: GitHub repository
  url: https://github.com/noi-techpark/opendatahub-datex2
servers:
  - url: /
    description: >
      Same host the docs page is served from. Kept relative rather than an
      absolute URL so "Try it out" works against whichever environment
      (production, testing, or local) is currently serving this page,
      without running into cross-origin request issues.
paths:
  /datex/2/:
    get:
      summary: List available providers
      description: Returns the available providers, and the DATEX II files published for each.
      tags:
        - datex
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                description: Provider name to feed type to feed URL.
                additionalProperties:
                  type: object
                  additionalProperties:
                    type: string
                    format: uri
              example:
                province-bz:
                  situation-publication: "https://datex.api.opendatahub.com/datex/2/province-bz/situation-publication.xml"
  /datex/2/{provider}/situation-publication.xml:
    get:
      summary: DATEX II situation publication
      description: Returns the latest DATEX II SituationPublication XML for the given event provider.
      tags:
        - datex
      parameters:
        - name: provider
          in: path
          required: true
          description: Event provider slug, e.g. province-bz
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <d2LogicalModel xmlns="http://datex2.eu/schema/2/2_0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" modelBaseVersion="2">
                  <exchange>
                    <supplierIdentification>
                      <country>it</country>
                      <nationalIdentifier>ITPBZ</nationalIdentifier>
                    </supplierIdentification>
                  </exchange>
                  <payloadPublication xmlns:_XMLSchema-instance="http://www.w3.org/2001/XMLSchema-instance" _XMLSchema-instance:type="SituationPublication" lang="it">
                    <publicationTime>2026-08-13T09:24:52.671Z</publicationTime>
                    <publicationCreator>
                      <country>it</country>
                      <nationalIdentifier>ITPBZ</nationalIdentifier>
                    </publicationCreator>
                    <situation id="00937352-d044-58be-a11c-0b5d027d323d" version="1">
                      <overallSeverity>medium</overallSeverity>
                      <headerInformation>
                        <confidentiality>noRestriction</confidentiality>
                        <informationStatus>real</informationStatus>
                        <urgency>normalUrgency</urgency>
                      </headerInformation>
                      <situationRecord _XMLSchema-instance:type="RoadOrCarriagewayOrLaneManagement" id="00937352-d044-58be-a11c-0b5d027d323d" version="1">
                        <situationRecordCreationReference>2918412</situationRecordCreationReference>
                        <situationRecordCreationTime>2025-11-18T10:48:13.949Z</situationRecordCreationTime>
                        <situationRecordVersionTime>2026-06-10T07:10:00.626Z</situationRecordVersionTime>
                        <probabilityOfOccurrence>certain</probabilityOfOccurrence>
                        <source>
                          <sourceCountry>it</sourceCountry>
                          <sourceIdentification>ITPBZ</sourceIdentification>
                          <sourceName>
                            <values>
                              <value lang="it">PROVINCE_BZ</value>
                            </values>
                          </sourceName>
                          <sourceType>roadAuthorities</sourceType>
                          <reliable>true</reliable>
                        </source>
                        <validity>
                          <validityStatus>active</validityStatus>
                          <validityTimeSpecification>
                            <overallStartTime>2025-01-26T23:00:00.000Z</overallStartTime>
                            <overallEndTime>2028-01-31T00:00:00.000Z</overallEndTime>
                          </validityTimeSpecification>
                        </validity>
                        <generalPublicComment>
                          <comment>
                            <values>
                              <value lang="it">Intralcio Viabilità Generale Chiusura o Blocco</value>
                            </values>
                          </comment>
                          <commentDateTime>2026-06-10T07:10:00.626Z</commentDateTime>
                          <commentType>description</commentType>
                        </generalPublicComment>
                        <groupOfLocations _XMLSchema-instance:type="Point">
                          <pointByCoordinates>
                            <pointCoordinates>
                              <latitude>46.49305</latitude>
                              <longitude>11.354679</longitude>
                            </pointCoordinates>
                          </pointByCoordinates>
                        </groupOfLocations>
                        <complianceOption>mandatory</complianceOption>
                        <roadOrCarriagewayOrLaneManagementType>singleAlternateLineTraffic</roadOrCarriagewayOrLaneManagementType>
                      </situationRecord>
                    </situation>
                  </payloadPublication>
                </d2LogicalModel>
        "404":
          description: Not found
