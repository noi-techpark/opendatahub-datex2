# This example config is for the Bolzano/South Tyrol feed, but nothing in
# the code assumes that - eventsUrl/source/idPrefix/internalSupplier are all
# just config values. Supporting another region or place means writing
# another config file like this one and running another instance of the
# binary against it (its own listenAddr and recipient paths), not a code
# change.
listenAddr: ":8080"
baseUrl: "http://localhost:8080"
provider: "province-bz"
eventsUrl: "https://content.api.opendatahub.testingmachine.eu/v1/Announcement?pagesize=200000&tagfilter=announcement%3Atraffic-event&removenullvalues=true&getasidarray=false&source=PROVINCE_BZ&fields=Id%2CTagIds%2CGeo%2CMapping%2C_Meta%2CStartTime%2CEndTime%2CCreationTime%2CVersionTime%2CDetail"
source: "PROVINCE_BZ"
pollIntervalSeconds: 20
idPrefix: "urn:announcements:provincebz:"
internalSupplier: "ITPBZ"

subtypes:
  - category: "traffic-event:congestion"
    classname: "AbnormalTraffic"
    typeValue: "slowTraffic"
    severity: "high"
    enabled: true
  - category: "traffic-event:accident"
    classname: "Accident"
    typeValue: "accident"
    severity: "high"
    enabled: true
  - category: "traffic-event:animal-on-road"
    classname: "AnimalPresenceObstruction"
    typeValue: "animalsOnTheRoad"
    severity: "high"
    enabled: true
  - category: "traffic-event:caution"
    classname: "RoadOrCarriagewayOrLaneManagement"
    typeValue: "other"
    severity: "medium"
    enabled: true
  - category: "traffic-event:road-work"
    classname: "MaintenanceWorks"
    typeValue: "roadworks"
    severity: "medium"
    enabled: true
  - category: "traffic-event:weather-related"
    classname: "PoorEnvironmentCondition"
    typeValue: "fog"
    severity: "high"
    enabled: true
  - category: "traffic-event:event"
    classname: "PublicEvent"
    typeValue: "majorEvent"
    severity: "medium"
    enabled: true
  - category: "traffic-event:prohibition"
    classname: "RoadOrCarriagewayOrLaneManagement"
    typeValue: "other"
    severity: "high"
    enabled: true
  - category: "traffic-event:closure"
    classname: "RoadOrCarriagewayOrLaneManagement"
    typeValue: "roadClosed"
    severity: "high"
    enabled: true
  - category: "traffic-event:hindrance"
    classname: "RoadOrCarriagewayOrLaneManagement"
    typeValue: "singleAlternateLineTraffic"
    severity: "medium"
    enabled: true
  - category: "traffic-event:speed-camera"
    classname: "SpeedManagement"
    typeValue: "policeSpeedChecksInOperation"
    severity: "low"
    enabled: true
  - category: "traffic-event:road-condition"
    classname: "WinterDrivingManagement"
    typeValue: "winterEquipmentOnBoardRequired"
    extraAttribute: "complianceOption"
    extraValue: "mandatory"
    severity: "medium"
    enabled: true

recipients:
  - type: "situation-publication"
    supplier: "IT492"
    description: "A22 - Brenner motorway"
    path: "/datex/2/province-bz/situation-publication.xml"
    enabled: true
