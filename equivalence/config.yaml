# Mirrors equivalence/initdb.sql exactly (same category->classname/typeValue/
# severity mappings, "prohibition" disabled - see subtypes.yaml), used by
# src/equivalence_test.go to run the Go pipeline against the same fixture
# data fed to the dockerized C# app.

listenAddr: ":8080"
subtypesFile: "subtypes.yaml"

providers:
  - name: "province-bz"
    eventsUrl: "http://fixture-server:8000/v1/Announcement"
    source: "PROVINCE_BZ"
    pollIntervalSeconds: 20
    idPrefix: "urn:announcements:provincebz:"
    internalSupplier: "ITPBZ"
    recipients:
      - type: "situation-publication"
        supplier: "IT492"
        description: "A22 - Brenner motorway"
        path: "/datex/2/province-bz/situation-publication.xml"
        enabled: true
