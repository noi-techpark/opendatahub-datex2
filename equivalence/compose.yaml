services:
  fixture-server:
    image: python:3-alpine
    working_dir: /fixtures
    volumes:
      - ./fixtures:/fixtures:ro
    command: ["python3", "-m", "http.server", "8000"]

  db:
    image: postgres:17.0
    shm_size: 1g
    environment:
      POSTGRES_PASSWORD: pgpass
    volumes:
      - ./initdb.sql:/docker-entrypoint-initdb.d/initdb.sql

  datexpub:
    image: datexpub:local
    user: root
    environment:
      TZ: Europe/Rome
    volumes:
      - ./appsettings.json:/app/appsettings.json
      - ./log:/app/log
      - ./pubblicazioni:/app/pubblicazioni
    depends_on:
      - db
      - fixture-server
